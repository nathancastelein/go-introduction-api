openapi: 3.0.2
servers:
  - url: /
info:
  description: |-
    This is a sample Pet Shelter Server based on the OpenAPI 3.0 specification. 
    It is based on [the Pet Store sample](https://github.com/swagger-api/swagger-petstore) provided by Swagger Team.
    It is proposed as an exercise for a Go course about APIs.
    Find out more about Swagger: [https://swagger.io](https://swagger.io)
  version: 1.0.0
  title: Swagger Pet Shelter - OpenAPI 3.0
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
tags:
  - name: pet
    description: Everything about your Pets
paths:
  /pet:
    get:
      tags:
        - pet
      summary: Lists Pets
      description: ""
      operationId: listPets
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
  "/pet/{petId}":
    get:
      tags:
        - pet
      summary: Find pet by ID
      description: Returns a single pet
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid ID supplied
        "404":
          description: Pet not found
  "/pet/{petId}/rename":
    post:
      tags:
        - pet
      summary: Rename a pet
      description: Rename a single pet
      operationId: renamePetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to rename
          required: true
          schema:
            type: integer
            format: int
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid name supplied
        "404":
          description: Pet not found
      requestBody:
        description: Update an existent pet in the store
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newName:
                  type: string
              required:
                - newName
components:
  schemas:
    Pet:
      x-swagger-router-model: io.swagger.petstore.model.Pet
      required:
        - id
        - name
        - category
      properties:
        id:
          type: integer
          format: int
          example: 1
        name:
          type: string
          example: Rafale
        category:
          type: string
          example: Dog
      type: object
    NewPet:
      x-swagger-router-model: io.swagger.petstore.model.NewPet
      required:
        - name
        - category
      properties:
        name:
          type: string
          example: Rafale
        category:
          type: string
          example: Dog
      type: object
